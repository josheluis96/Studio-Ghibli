<div class="container">
  @if (isLoading()) {
  <div class="loading">Cargando locaciones...</div>
  } @else {
  <div class="locations-grid">
    @for (location of locations(); track location.id) {
    <app-location-card [location]="location"></app-location-card>
    } @empty {
    <p>No hay locaciones disponibles en este momento.</p>
    }
  </div>
  }
</div>
