<div class="container">

    @if (isLoading()) {
    <div class="loading">Cargando películas...</div>
    } @else {
    <div class="films-grid">
        @for (film of films(); track film.id) {
        <app-film-card [film]="film"></app-film-card>
        } @empty {
        <p>No hay películas disponibles en este momento.</p>
        }
    </div>
    }
</div>
