<div class="card shadow-2 p-0 border-round overflow-hidden bg-white">
    <div class="w-full  overflow-hidden relative">
        <img [src]="film().movie_banner" class="w-full  object-fit" [alt]="film().title">
        <div class="absolute bottom-0 left-0 w-full p-3 bg-black-alpha-50 text-white">
            <span class="text-sm uppercase tracking-wider font-semibold">{{ film().original_title_romanised }}</span>
        </div>
    </div>

    <div class="grid p-4">

        <div class="col-12 md:col-3 text-center">
            <img [src]="film().image" class="w-full border-round shadow-4" style="max-width: 200px">
        </div>

        <div class="col-12 md:col-9">
            <div class="flex flex-column gap-2">
                <h1 class="m-0 text-4xl text-blue-800">{{ film().title }}</h1>
                <h2 class="m-0 text-xl text-500 font-medium">{{ film().original_title }}</h2>

                <p class="line-height-3 text-700 mt-3">
                    {{ film().description }}
                </p>
                <div class="flex flex-wrap gap-4 mt-3 border-top-1 border-100 pt-3">
                    <div class="flex flex-column">
                        <span class="text-500 font-semibold text-xs uppercase">Director</span>
                        <span class="text-900 font-medium">{{ film().director }}</span>
                    </div>
                    <div class="flex flex-column">
                        <span class="text-500 font-semibold text-xs uppercase">Productor</span>
                        <span class="text-900 font-medium">{{ film().producer }}</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 mt-4">
            <div class="grid bg-gray-50 border-round p-3 text-center">
                <div class="col-4 border-right-1 border-200">
                    <i class="pi pi-calendar text-blue-500 mb-2"></i>
                    <div class="text-sm text-500">Lanzamiento</div>
                    <div class="font-bold text-900">{{ film().release_date }}</div>
                </div>
                <div class="col-4 border-right-1 border-200">
                    <i class="pi pi-clock text-green-500 mb-2"></i>
                    <div class="text-sm text-500">Duración</div>
                    <div class="font-bold text-900">{{ film().running_time }} min</div>
                </div>
                <div class="col-4">
                    <i class="pi pi-star-fill text-yellow-500 mb-2"></i>
                    <div class="text-sm text-500">RT Score</div>
                    <div class="font-bold text-900">{{ film().rt_score }}%</div>
                </div>
            </div>
        </div>
    </div>
</div>
