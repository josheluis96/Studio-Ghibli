<div class="container">
  @if (isLoading()) {
  <div class="loading">Cargando personas...</div>
  } @else {
  <div class="people-grid">
    @for (person of people(); track person.id) {
    <app-person-card [person]="person"></app-person-card>
    } @empty {
    <p>No hay personas disponibles en este momento.</p>
    }
  </div>
  }
</div>
