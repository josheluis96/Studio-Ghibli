<div class="card">
    <p-menubar [model]="items">
        <ng-template #item let-item let-root="root">
            <a pRipple class="flex items-center px-4 py-3 cursor-pointer gap-2">
                <span>{{ item.label }}</span>
                <p-badge *ngIf="item.badge" [ngClass]="{ 'ms-auto': !root }" [value]="item.badge" />
                <span *ngIf="item.shortcut"
                    class="ms-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1">{{
                    item.shortcut }}</span>
                <i *ngIf="item.items" [ngClass]="['ms-auto pi', root ? 'pi-angle-down' : 'pi-angle-right']"></i>
            </a>
        </ng-template>
        <ng-template #end>
            <div class="flex items-center gap-2">
                <h1 class="text-blue-600 font-bold mr-4">Ghibli Studio</h1>
            </div>
        </ng-template>
    </p-menubar>
</div>
