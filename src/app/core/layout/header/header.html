<p-toolbar class="bg-white" styleClass="bg-white border-none py-2">
    <ng-template #center>
        <h1 class="text-blue-600 font-bold mr-4">Ghibli Studio</h1>
    </ng-template>
    <ng-template #start>
        <div class="flex gap-4">
            @for (item of menuItems; track item.label) {
            <p-button [label]="item.label" (click)="navigatePage(item.route)" variant="text" severity="secondary" />
            }
        </div>
    </ng-template>
</p-toolbar>
