<div class="card">
    <p-toolbar>
        <ng-template #center>
            <div class=" flex items-center gap-2">
                <p-button label="Films" (click)="navegarfilms()"  />
                <p-button label="People" (click)="navegarPeople()" />
            </div>
        </ng-template>
        <ng-template #end>
            <div class="flex items-center gap-2">
                <p-avatar image="https://robohash.org/studio-ghibli" [style]="{ width: '32px', height: '32px' }" />
            </div>
        </ng-template>
    </p-toolbar>
</div>
